<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Trợ lý sự cố điện gia dụng</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 36px 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
        .brand-logo {
            max-height: 52px;
            max-width: 160px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .brand-fallback {
            width: 48px;
            height: 48px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid #38bdf8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 12px auto;
        }
        h2 { margin-top: 0; color: #fff; font-size: 1.3rem; text-align: center; font-weight: 700; }
        p { color: #94a3b8; font-size: 0.85rem; text-align: center; line-height: 1.5; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #cbd5e1; }
        input {
            width: 100%;
            box-sizing: border-box;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 14px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #38bdf8; }
        button {
            width: 100%;
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .status { margin-top: 16px; font-size: 0.9rem; text-align: center; padding: 10px; border-radius: 8px; display: none; }
        .status.error { color: #f87171; background: rgba(239, 68, 68, 0.1); border: 1px solid #dc2626; display: block; }
        .status.success { color: #34d399; background: rgba(16, 185, 129, 0.1); border: 1px solid #059669; display: block; }
        .back-link { display: inline-block; margin-top: 16px; color: #38bdf8; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="/public/branding/dhv-logo.png" alt="DHV Logo" class="brand-logo" onerror="this.style.display='none'; document.getElementById('forgot-fallback').style.display='flex';" />
            <div id="forgot-fallback" class="brand-fallback" style="display: none;">🛠️</div>
            <h2>Trợ lý sự cố điện gia dụng</h2>
            <p>Khôi phục mật khẩu tài khoản an toàn qua Email</p>
        </div>
        <div id="form-container">
            <div class="form-group">
                <label for="email">Địa chỉ Email</label>
                <input type="email" id="email" placeholder="example@domain.com" required>
            </div>
            <button id="submit-btn" onclick="submitForgot()">Gửi liên kết khôi phục</button>
        </div>
        <div id="status-msg" class="status"></div>
        <div style="text-align: center; margin-top: 16px;">
            <a href="http://localhost:8001/login" id="back-to-login" class="back-link">← Quay lại trang Đăng nhập Chatbot</a>
        </div>
    </div>
    <script>
        function getFrontendLoginUrl() {
            const isChainlitPort = window.location.port === "8001";
            return isChainlitPort ? "/login" : `${window.location.protocol}//${window.location.hostname}:8001/login`;
        }

        window.addEventListener("DOMContentLoaded", () => {
            const backBtn = document.getElementById("back-to-login");
            if (backBtn) {
                backBtn.href = getFrontendLoginUrl();
            }
        });

        async function submitForgot() {
            const email = document.getElementById("email").value.trim();
            const statusEl = document.getElementById("status-msg");
            if (!email) {
                statusEl.className = "status error";
                statusEl.innerText = "Vui lòng nhập địa chỉ email.";
                return;
            }

            const btn = document.getElementById("submit-btn");
            btn.disabled = true;
            btn.innerText = "Đang gửi...";

            try {
                const apiUrl = "http://127.0.0.1:8000/auth/forgot-password";
                const res = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });
                const data = await res.json();
                statusEl.className = res.ok ? "status success" : "status error";
                statusEl.innerText = (res.ok ? "✅ " : "❌ ") + (data.message || data.detail);
                if (res.ok) {
                    document.getElementById("form-container").style.display = "none";
                } else {
                    btn.disabled = false;
                    btn.innerText = "Gửi liên kết khôi phục";
                }
            } catch (err) {
                statusEl.className = "status error";
                statusEl.innerText = "Lỗi kết nối máy chủ. Vui lòng thử lại.";
                btn.disabled = false;
                btn.innerText = "Gửi liên kết khôi phục";
            }
        }
    </script>
</body>
</html>
