<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Trợ lý sự cố điện gia dụng</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #111827;
            --border: #1f2937;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        .header-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            max-height: 52px;
            max-width: 160px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .brand-fallback {
            width: 48px;
            height: 48px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 12px auto;
        }

        h2 {
            margin: 0;
            color: #fff;
            font-size: 1.3rem;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin: 6px 0 0 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 11px 14px;
            color: #fff;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            background: var(--accent-hover);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }

        button:hover {
            background: #0369a1;
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .status {
            margin-top: 16px;
            font-size: 0.85rem;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: block;
        }

        .status.success {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
            display: block;
        }

        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .footer-links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-section">
            <img src="/public/branding/dhv-logo.png" alt="DHV Logo" class="brand-logo" onerror="this.style.display='none'; document.getElementById('reg-fallback').style.display='flex';" />
            <div id="reg-fallback" class="brand-fallback" style="display: none;">🛠️</div>
            <h2>Trợ lý sự cố điện gia dụng</h2>
            <p class="subtitle">Đăng ký tài khoản người dùng mới</p>
        </div>

        <div id="form-container">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Ví dụ: kythuatvien123" required />
            </div>

            <div class="form-group">
                <label for="email">Địa chỉ Email (dùng để khôi phục mật khẩu)</label>
                <input type="email" id="email" placeholder="example@gmail.com" required />
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" required />
            </div>

            <div class="form-group">
                <label for="confirm_password">Xác nhận mật khẩu</label>
                <input type="password" id="confirm_password" placeholder="Nhập lại mật khẩu" required />
            </div>

            <button type="button" id="submit-btn" onclick="submitRegister()">Đăng ký tài khoản</button>
        </div>

        <div id="status-msg" class="status"></div>

        <div class="footer-links">
            Đã có tài khoản? <a href="http://localhost:8001/login" id="back-to-login">Đăng nhập ngay</a>
        </div>
    </div>

    <script>
        function getFrontendLoginUrl() {
            const isChainlitPort = window.location.port === "8001";
            return isChainlitPort ? "/login" : `${window.location.protocol}//${window.location.hostname}:8001/login`;
        }

        window.addEventListener("DOMContentLoaded", () => {
            const backBtn = document.getElementById("back-to-login");
            if (backBtn) {
                backBtn.href = getFrontendLoginUrl();
            }
        });

        async function submitRegister() {
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPass = document.getElementById("confirm_password").value;
            const statusEl = document.getElementById("status-msg");

            if (!username || username.length < 3) {
                statusEl.className = "status error";
                statusEl.innerText = "Tên đăng nhập phải có ít nhất 3 ký tự.";
                return;
            }
            if (!password || password.length < 6) {
                statusEl.className = "status error";
                statusEl.innerText = "Mật khẩu phải có ít nhất 6 ký tự.";
                return;
            }
            if (password !== confirmPass) {
                statusEl.className = "status error";
                statusEl.innerText = "Mật khẩu xác nhận không khớp.";
                return;
            }

            const btn = document.getElementById("submit-btn");
            btn.disabled = true;
            btn.innerText = "Đang xử lý...";

            try {
                const res = await fetch("http://localhost:8000/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: username,
                        email: email || null,
                        password: password
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    statusEl.className = "status success";
                    statusEl.innerText = "✅ Đăng ký thành công! Đang chuyển hướng về trang đăng nhập...";
                    document.getElementById("form-container").style.display = "none";
                    setTimeout(() => {
                        window.location.href = getFrontendLoginUrl();
                    }, 1800);
                } else {
                    statusEl.className = "status error";
                    statusEl.innerText = "❌ " + (data.detail || data.message || "Đăng ký thất bại.");
                    btn.disabled = false;
                    btn.innerText = "Đăng ký tài khoản";
                }
            } catch (err) {
                statusEl.className = "status error";
                statusEl.innerText = "Lỗi kết nối máy chủ API Backend. Vui lòng thử lại.";
                btn.disabled = false;
                btn.innerText = "Đăng ký tài khoản";
            }
        }
    </script>
</body>
</html>
