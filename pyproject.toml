[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Vietnamese electronics troubleshooting RAG chatbot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
